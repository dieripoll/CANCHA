<body>
<div id="stage"><div id="box"><img id="a" alt=""><img id="b" alt=""></div></div>
<div id="msg">Conectando…</div>
<button id="menu">☰</button>
<div id="keys">
  <h4>Fichas</h4><div class="grid">
    <button data-k="t">Tabla</button><button data-k="p">Estadísticas</button>
    <button data-k="l">Formación</button><button data-k="a">Tarjetas</button>
    <button data-k="c">Cara a cara</button><button data-k="b">Suplentes</button>
    <button data-k="r">Árbitro</button><button data-k="s">Estadio</button>
    <button data-k="Escape" class="w scr" style="display:none">Quitar ficha</button></div>
  <div id="zoc"><h4>Zócalos</h4><div class="grid">
    <button data-k="1">Previa</button><button data-k="e">Entretiempo</button>
    <button data-k="z" class="g">Gol local</button><button data-k="x" class="g">Gol visitante</button>
    <button data-k="q">Quitar previa / entret.</button><button data-k="Escape" class="w">Quitar todo</button></div></div>
  <h4>Pantalla</h4><div class="grid">
    <button id="rot">Girar</button><button id="fs">Pantalla completa</button><button id="chg">Código</button></div>
</div>
<div id="start">
  <h1>Cancha táctil</h1>
  <p>Escribí el código de la extensión (es el <b>id=</b> de las direcciones de vMix, figura en el panel en "Código").</p>
  <input id="code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="go">Empezar</button>
  <p>Para verla sin barras: en Safari, Compartir › Agregar a pantalla de inicio, y abrila desde ese ícono.</p>
</div>

  var q = {}; location.search.replace(/^\?/, '').split('&').forEach(function (p) { var kv = p.split('='); if (kv[0]) q[kv[0]] = decodeURIComponent(kv[1] || ''); });
  var rot = +(store.get('ipadRot') || 0);
  $('code').value = q.id || store.get('ipadCode') || '';

  // the 1080x1920 graphic, as big as the screen allows (turned when the iPad is mounted sideways)
  function fit() {
    var W = window.innerWidth, H = window.innerHeight, side = rot % 180 !== 0;
    var k = side ? Math.min(W / 1920, H / 1080) : Math.min(W / 1080, H / 1920);
    var t = 'translate(-50%,-50%) rotate(' + rot + 'deg) scale(' + k + ')';
    var box = $('box');
    box.style.webkitTransformOrigin = box.style.transformOrigin = '50% 50%';
    box.style.marginLeft = '-540px'; box.style.marginTop = '-960px';
    box.style.webkitTransform = box.style.transform = 'rotate(' + rot + 'deg) scale(' + k + ')';
    box.style.left = '50%'; box.style.top = '50%';
  }
  window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 300); }); fit();

  function show(url) {
    if (!url || url === last) return;
    last = url;
    var next = imgs[1 - cur];
    next.onload = function () { next.className = 'on'; imgs[cur].className = ''; cur = 1 - cur; };
    next.src = url;
  }
  var msgT = null;
  function say(t, keep) { var m = $('msg'); m.textContent = t; m.className = ''; clearTimeout(msgT); if (!keep) msgT = setTimeout(function () { m.className = 'hide'; }, 3000); }

  // ---------- connection with the extension's panel (same code as the vMix overlays)
  var peer = null, conn = null, gen = 0, retryT = null, lastSeen = 0, code = '', askT = 0;
  function retry(g, why) {
    if (g !== gen || retryT) return;
    say('Reconectando… ' + (why || ''), true);
    retryT = setTimeout(function () {
      retryT = null; gen++;
      var p = peer, c = conn; peer = null; conn = null;
      try { if (c) c.close(); } catch (e) {} try { if (p) p.destroy(); } catch (e) {}
      connect();
    }, 3000);
  }
  function connect() {
    var g = gen;
    var p = peer = new Peer(undefined, { debug: 0 });
    p.on('open', function () {
      if (g !== gen) return;
      var c = conn = p.connect('alineaciones-' + code, { reliable: true });
      c.on('open', function () { if (g !== gen) return; lastSeen = Date.now(); say(last ? 'Conectado' : 'Conectado · esperando la cancha…', !last); c.send({ hello: true, pitch: true }); askT = Date.now(); });
      c.on('data', function (m) { if (g !== gen) return; lastSeen = Date.now(); onData(m); });
      c.on('close', function () { retry(g, '(se cerró el panel)'); });
      c.on('error', function () { retry(g, '(error)'); });
    });
    p.on('error', function (e) { retry(g, e && e.type === 'peer-unavailable' ? '(el panel no está abierto)' : '(' + (e && e.type || 'error') + ')'); });
    p.on('disconnected', function () { retry(g, '(sin servidor)'); });
  }
  setInterval(function () {
    if (conn && conn.open) { try { conn.send({ ping: 1 }); } catch (e) {} }
    // connected but no picture yet: ask again and say what to check in the panel
    if (conn && conn.open && !last && Date.now() - askT > 8000) {
      askT = Date.now(); try { conn.send({ hello: true, pitch: true }); } catch (e) {}
      say('Conectado, pero el panel no manda la cancha: revisá que la extensión sea la 3.6 o más nueva y que haya un partido cargado', true);
    }
    if (conn && lastSeen && Date.now() - lastSeen > 12000) { lastSeen = 0; retry(gen, '(el panel no responde)'); }
  }, 4000);

  // ---------- start (a tap is needed to keep the screen awake)
  function start() {
    code = String($('code').value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    if (code.length < 4) { $('code').focus(); return; }
    store.set('ipadCode', code);
    $('start').style.display = 'none';
    var v = $('ns'); try { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
    say('Conectando…', true);
    gen++; connect();
  }
  $('go').addEventListener('click', start);
  $('code').addEventListener('keydown', function (e) { if (e.keyCode === 13) start(); });

  // ---------- cards: drawn here by the same code as the extension, with the data the panel sends
  function cardLoading(hit) {
    pending = { hit: hit, resolve: null, reject: null };
    var p = pending;
    PlayerCard.open(box, hit, function () { return new Promise(function (res, rej) { p.resolve = res; p.reject = rej; }); }, lastTr);
  }
  function cardData(m) {
    if (m.tr) lastTr = m.tr;
    if (!pending || JSON.stringify(pending.hit) !== JSON.stringify(m.hit)) cardLoading(m.hit);
    var p = pending; pending = null;
    if (m.err) { if (p.reject) p.reject(new Error(m.err)); return; }
    // reopen with the translations of the panel (names of stats, positions and countries)
    PlayerCard.open(box, m.hit, function () { return Promise.resolve({ kind: m.kind, d: m.d }); }, lastTr);
  }
  function onData(m) {
    if (!m) return;
    if (m.pitch) { if (!last) say('Conectado'); if (m.hits) hits = m.hits; show(m.pitch); }
    if (m.popen) cardLoading(m.popen.hit);
    if (m.pcard) cardData(m.pcard);
    if (m.pclose) PlayerCard.close(box);
    // the Pantalla edition has no lower thirds: hide those buttons
    if (m.caps) {
      var ov = m.caps.ov !== false;
      $('zoc').style.display = ov ? '' : 'none';
      var q = document.querySelectorAll('#keys .scr');
      for (var i = 0; i < q.length; i++) q[i].style.display = ov ? 'none' : '';
    }
  }
  var sent = [];
  function send(o) { sent.push(o); if (sent.length > 20) sent.shift(); if (conn && conn.open) { try { conn.send({ ipad: o }); } catch (e) {} } }
  window.__test = { data: onData, sent: sent };     // used by the test page

  // a point of the screen in the graphic's 1080x1920 coordinates (the picture can be turned and scaled)
  function toGraphic(cx, cy) {
    var W = window.innerWidth, H = window.innerHeight, side = rot % 180 !== 0;
    var k = side ? Math.min(W / 1920, H / 1080) : Math.min(W / 1080, H / 1920);
    var dx = cx - W / 2, dy = cy - H / 2, a = -rot * Math.PI / 180;
    var x = dx * Math.cos(a) - dy * Math.sin(a), y = dx * Math.sin(a) + dy * Math.cos(a);
    return { x: x / k + 540, y: y / k + 960 };
  }
  // touch: a card open -> close it (or open the substitute touched in the bench card);
  // otherwise the player, crest, score, bench, stadium or whistle touched opens its card
  var dragged = false;
  box.addEventListener('click', function (e) {
    if (dragged) return;
    if (PlayerCard.isOpen(box)) {
      var sub = PlayerCard.subFromEvent(e);
      PlayerCard.close(box);
      send(sub ? { open: sub } : { close: true });
      return;
    }
    var p = toGraphic(e.clientX, e.clientY), h = PlayerCard.hitAt(hits, p.x, p.y);
    if (h) send({ open: h });
  });
  // drag a player to another place of his line or to another line (as in the extension)
  var st = null;
  box.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1 || PlayerCard.isOpen(box)) return;
    var t = e.touches[0], p = toGraphic(t.clientX, t.clientY);
    var h = null;
    for (var i = 0; i < hits.length; i++) { var x = hits[i]; if (x.kind === 'player' && !x.sent && p.x >= x.box[0] && p.x <= x.box[2] && p.y >= x.box[1] && p.y <= x.box[3]) { h = x; break; } }
    st = h ? { h: h, x0: p.x, y0: p.y, ghost: null } : null;
  }, { passive: true });
  box.addEventListener('touchmove', function (e) {
    if (!st) return;
    var t = e.touches[0], p = toGraphic(t.clientX, t.clientY);
    if (!st.ghost) {
      if (Math.sqrt(Math.pow(p.x - st.x0, 2) + Math.pow(p.y - st.y0, 2)) < 14) return;
      var g = document.createElement('div'), d = st.h.ph || 118;
      g.className = 'drag-ghost';
      g.style.width = d + 'px'; g.style.height = d + 'px';
      g.style.backgroundImage = 'url("' + imgs[cur].src + '")'; g.style.backgroundSize = '1080px 1920px';
      g.style.backgroundPosition = (-(st.h.cx - d / 2)) + 'px ' + (-(st.h.cy - d / 2)) + 'px';
      box.appendChild(g); st.ghost = g; st.d = d;
    }
    st.ghost.style.left = (p.x - st.d / 2) + 'px'; st.ghost.style.top = (p.y - st.d / 2) + 'px'; st.p = p;
    e.preventDefault();
  }, { passive: false });
  function endDrag(cancel) {
    var s0 = st; st = null;
    if (!s0 || !s0.ghost) return;
    s0.ghost.parentNode.removeChild(s0.ghost);
    dragged = true; setTimeout(function () { dragged = false; }, 400);
    if (cancel || !s0.p) return;
    var rows = LineupDrag.dropRows(hits, s0.h.side, s0.h.num, s0.p.x, s0.p.y);
    if (rows) { send({ drop: { side: s0.h.side, rows: rows } }); say('Formación cambiada'); }
  }
  box.addEventListener('touchend', function () { endDrag(false); });
  box.addEventListener('touchcancel', function () { endDrag(true); });

  // the keys of the extension as buttons
  $('menu').addEventListener('click', function () { $('keys').className = $('keys').className === 'show' ? '' : 'show'; });
  [].forEach.call(document.querySelectorAll('#keys [data-k]'), function (b) {
    b.addEventListener('click', function () { send({ key: b.getAttribute('data-k') }); say(b.textContent); });
  });
  $('rot').addEventListener('click', function (e) { e.stopPropagation(); rot = (rot + 90) % 360; store.set('ipadRot', rot); fit(); });
  $('fs').addEventListener('click', function (e) {
    e.stopPropagation();
    var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen;
    if (f) { try { f.call(d); } catch (x) {} } else say('En este iPad: Compartir › Agregar a pantalla de inicio');
  });
  $('chg').addEventListener('click', function (e) { e.stopPropagation(); $('keys').className = ''; $('start').style.display = ''; });
  window.__show = show;    // used by the test page
  if (q.id) start();
})();
</script>
</body>
